openapi: 3.1.0
info:
  title: Tavily Web Crawl Research API
  version: 1.0.0
  description: 'REST API for AI agents to search the web, extract page content, crawl

    sites, map sitemaps, and run AI-driven research tasks. Authenticated

    with a bearer API key (tvly- prefix).

    '
  contact:
    name: Tavily
    url: https://docs.tavily.com
servers:
- url: https://api.tavily.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Research
paths:
  /research:
    post:
      summary: Run AI research task
      description: Run an AI-driven research task that aggregates, ranks, and cites sources.
      operationId: research
      tags:
      - Research
      responses:
        '200':
          description: Research task created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
